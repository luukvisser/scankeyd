# Development tooling only: the daemon is standard library only and ships as a container image,
# not as a package.
[project]
name = "scankeyd"
version = "0.1.0"   # the same as scankeyd.__version__; CI checks it
description = "The Scan key of Brother network printers to a folder of scanned pages, without Brother's drivers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# The Home Assistant link over MQTT (MQTT_HOST); the rest of scankeyd is the standard library only.
ha = ["paho-mqtt>=2.1,<3"]

[dependency-groups]
dev = ["ruff==0.17.3", "ty==0.0.95", "paho-mqtt==2.1.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "TC", "FA"]

[tool.ty.terminal]
# warnings (e.g. deprecated APIs) fail the check too
error-on-warning = true

[tool.ty.rules]
# on top of ty's defaults: no bare generics, and overrides marked as such (typing.override, 3.12+)
missing-type-argument = "error"
missing-override-decorator = "error"
